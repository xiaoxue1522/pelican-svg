<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-label="A bicycle riding a pelican">
  <title>Bicycle riding a pelican</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6fc3f0"/>
      <stop offset="1" stop-color="#e6f6ff"/>
    </linearGradient>
    <clipPath id="frame"><rect width="800" height="500"/></clipPath>
    <g id="cloud" fill="#ffffff">
      <ellipse cx="0" cy="0" rx="46" ry="20"/>
      <ellipse cx="-28" cy="-12" rx="26" ry="18"/>
      <ellipse cx="14" cy="-18" rx="30" ry="22"/>
      <ellipse cx="44" cy="-4" rx="24" ry="14"/>
    </g>
    <g id="spokes" stroke="#9aa3ad" stroke-width="2.4">
      <line x1="-64" y1="0" x2="64" y2="0"/>
      <line x1="0" y1="-64" x2="0" y2="64"/>
      <line x1="-45" y1="-45" x2="45" y2="45"/>
      <line x1="-45" y1="45" x2="45" y2="-45"/>
      <rect x="36" y="-6" width="20" height="12" rx="3" fill="#ffb703" stroke="none"/>
    </g>
    <g id="wheel">
      <circle r="64" fill="none" stroke="#22252b" stroke-width="13"/>
      <circle r="56" fill="none" stroke="#c9d1d9" stroke-width="4"/>
      <g>
        <use href="#spokes"/>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="2.4s" repeatCount="indefinite"/>
      </g>
      <circle r="8" fill="#444b55"/>
    </g>
    <path id="foot" d="M-7,-4 L8,-5 L26,3 L22,6 L-6,6 Z"/>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="800" height="500" fill="url(#sky)"/>

    <!-- sun -->
    <g transform="translate(110 90)">
      <g stroke="#ffd166" stroke-width="5" stroke-linecap="round">
        <line x1="0" y1="-62" x2="0" y2="-48"/><line x1="0" y1="62" x2="0" y2="48"/>
        <line x1="-62" y1="0" x2="-48" y2="0"/><line x1="62" y1="0" x2="48" y2="0"/>
        <line x1="-44" y1="-44" x2="-34" y2="-34"/><line x1="44" y1="44" x2="34" y2="34"/>
        <line x1="-44" y1="44" x2="-34" y2="34"/><line x1="44" y1="-44" x2="34" y2="-34"/>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="24s" repeatCount="indefinite"/>
      </g>
      <circle r="36" fill="#ffd166"/>
      <circle r="28" fill="#ffe08a"/>
    </g>

    <!-- clouds -->
    <g opacity="0.95">
      <use href="#cloud" y="70"><animateTransform attributeName="transform" type="translate" from="900 0" to="-200 0" dur="38s" begin="-8s" repeatCount="indefinite"/></use>
      <use href="#cloud" y="140"><animateTransform attributeName="transform" type="translate" from="900 0" to="-200 0" dur="52s" begin="-30s" repeatCount="indefinite"/></use>
      <use href="#cloud" y="45"><animateTransform attributeName="transform" type="translate" from="900 0" to="-200 0" dur="46s" begin="-22s" repeatCount="indefinite"/></use>
    </g>

    <!-- hills -->
    <path fill="#a8dba8" d="M0,350 Q200,250 400,350 T800,350 T1200,350 T1600,350 L1600,500 L0,500 Z">
      <animateTransform attributeName="transform" type="translate" from="0 0" to="-800 0" dur="60s" repeatCount="indefinite"/>
    </path>
    <path fill="#79c27a" d="M0,410 Q100,360 200,410 T400,410 T600,410 T800,410 T1000,410 T1200,410 T1400,410 T1600,410 L1600,500 L0,500 Z">
      <animateTransform attributeName="transform" type="translate" from="0 0" to="-800 0" dur="20s" repeatCount="indefinite"/>
    </path>

    <!-- bushes -->
    <g fill="#3f9b53">
      <g id="bushes">
        <circle cx="150" cy="432" r="20"/><circle cx="174" cy="436" r="15"/><circle cx="128" cy="438" r="13"/>
        <circle cx="620" cy="434" r="17"/><circle cx="640" cy="438" r="12"/>
      </g>
      <use href="#bushes" x="800"/>
      <animateTransform attributeName="transform" type="translate" from="0 0" to="-800 0" dur="4s" repeatCount="indefinite"/>
    </g>

    <!-- road -->
    <rect y="440" width="800" height="60" fill="#5a5f6b"/>
    <rect y="440" width="800" height="4" fill="#757b88"/>
    <line x1="-150" y1="484" x2="950" y2="484" stroke="#f4f1de" stroke-width="5" stroke-dasharray="60 80">
      <animate attributeName="stroke-dashoffset" from="0" to="140" dur="0.467s" repeatCount="indefinite"/>
    </line>

    <!-- wind streaks -->
    <g stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.7">
      <line x1="0" y1="150" x2="70" y2="150"><animateTransform attributeName="transform" type="translate" from="850 0" to="-200 0" dur="1.3s" repeatCount="indefinite"/></line>
      <line x1="0" y1="270" x2="45" y2="270"><animateTransform attributeName="transform" type="translate" from="850 0" to="-200 0" dur="1.1s" begin="-0.5s" repeatCount="indefinite"/></line>
      <line x1="0" y1="400" x2="60" y2="400"><animateTransform attributeName="transform" type="translate" from="850 0" to="-200 0" dur="1.6s" begin="-0.9s" repeatCount="indefinite"/></line>
    </g>

    <!-- shadow -->
    <ellipse cx="405" cy="462" rx="120" ry="7" fill="#000" opacity="0.22">
      <animate attributeName="rx" values="120;108;120" dur="0.3s" repeatCount="indefinite"/>
    </ellipse>

    <!-- far leg -->
    <path fill="none" stroke="#c9701c" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" d="M390,372 L360,410 L390,452">
      <animate attributeName="d" dur="0.6s" repeatCount="indefinite" values="M390,372 L350.2,402.3 L345,452;M390,372 L345.5,394.7 L352.5,444.2;M390,372 L343.3,389.9 L360,437;M390,372 L342.5,387.5 L367.5,430.8;M390,372 L342.6,387.9 L375,426;M390,372 L343.9,391.3 L382.5,423;M390,372 L346.7,397 L390,422;M390,372 L351.4,403.7 L397.5,423;M390,372 L357.6,410.1 L405,426;M390,372 L365,415.3 L412.5,430.8;M390,372 L373.3,419.1 L420,437;M390,372 L383,421.5 L427.5,444.2;M390,372 L395.2,421.7 L435,452;M390,372 L387.6,421.9 L427.5,452;M390,372 L380.7,421.1 L420,452;M390,372 L374.5,419.5 L412.5,452;M390,372 L368.9,417.4 L405,452;M390,372 L364.1,414.8 L397.5,452;M390,372 L360,412 L390,452;M390,372 L356.6,409.2 L382.5,452;M390,372 L353.9,406.6 L375,452;M390,372 L352,404.5 L367.5,452;M390,372 L350.7,402.9 L360,452;M390,372 L350.1,402.1 L352.5,452;M390,372 L350.2,402.3 L345,452"/>
    </path>
    <use href="#foot" fill="#c9701c">
      <animateTransform attributeName="transform" type="translate" dur="0.6s" repeatCount="indefinite" values="345 452;352.5 444.2;360 437;367.5 430.8;375 426;382.5 423;390 422;397.5 423;405 426;412.5 430.8;420 437;427.5 444.2;435 452;427.5 452;420 452;412.5 452;405 452;397.5 452;390 452;382.5 452;375 452;367.5 452;360 452;352.5 452;345 452"/>
    </use>
    <!-- near leg -->
    <path fill="none" stroke="#f28c28" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" d="M390,372 L360,410 L390,452">
      <animate attributeName="d" dur="0.6s" repeatCount="indefinite" values="M390,372 L395.2,421.7 L435,452;M390,372 L387.6,421.9 L427.5,452;M390,372 L380.7,421.1 L420,452;M390,372 L374.5,419.5 L412.5,452;M390,372 L368.9,417.4 L405,452;M390,372 L364.1,414.8 L397.5,452;M390,372 L360,412 L390,452;M390,372 L356.6,409.2 L382.5,452;M390,372 L353.9,406.6 L375,452;M390,372 L352,404.5 L367.5,452;M390,372 L350.7,402.9 L360,452;M390,372 L350.1,402.1 L352.5,452;M390,372 L350.2,402.3 L345,452;M390,372 L345.5,394.7 L352.5,444.2;M390,372 L343.3,389.9 L360,437;M390,372 L342.5,387.5 L367.5,430.8;M390,372 L342.6,387.9 L375,426;M390,372 L343.9,391.3 L382.5,423;M390,372 L346.7,397 L390,422;M390,372 L351.4,403.7 L397.5,423;M390,372 L357.6,410.1 L405,426;M390,372 L365,415.3 L412.5,430.8;M390,372 L373.3,419.1 L420,437;M390,372 L383,421.5 L427.5,444.2;M390,372 L395.2,421.7 L435,452"/>
    </path>
    <use href="#foot" fill="#f28c28">
      <animateTransform attributeName="transform" type="translate" dur="0.6s" repeatCount="indefinite" values="435 452;427.5 452;420 452;412.5 452;405 452;397.5 452;390 452;382.5 452;375 452;367.5 452;360 452;352.5 452;345 452;352.5 444.2;360 437;367.5 430.8;375 426;382.5 423;390 422;397.5 423;405 426;412.5 430.8;420 437;427.5 444.2;435 452"/>
    </use>

    <!-- pelican + its rider, bouncing with each step -->
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -5;0 0" dur="0.3s" repeatCount="indefinite"/>

      <!-- tail -->
      <path d="M314,322 L268,304 L290,328 L260,338 L292,345 L274,362 L320,352 Z" fill="#f3ecdd">
        <animateTransform attributeName="transform" type="rotate" values="-4 314 336;5 314 336;-4 314 336" dur="0.3s" repeatCount="indefinite"/>
      </path>

      <!-- the bicycle (rider) -->
      <g transform="rotate(-5 400 330) translate(232 99) scale(0.42)">
        <g>
          <animateTransform attributeName="transform" type="rotate" values="-2 400 460;2 400 460;-2 400 460" dur="0.6s" repeatCount="indefinite"/>
          <!-- far crank + pedal (behind frame) -->
          <g>
            <animateTransform attributeName="transform" type="rotate" from="0 390 390" to="360 390 390" dur="1.2s" repeatCount="indefinite"/>
            <path d="M392,384 L342,386 Q337,390 342,394 L392,396 Z" fill="#9aa3ad" stroke="#4a515c" stroke-width="2.5" stroke-linejoin="round"/>
            <g>
              <animateTransform attributeName="transform" type="rotate" from="0 342 390" to="-360 342 390" dur="1.2s" repeatCount="indefinite"/>
              <rect x="323" y="383" width="38" height="14" rx="4" fill="#3a3f47"/>
              <rect x="328" y="386.5" width="8" height="7" rx="1.5" fill="#d99a02"/>
              <rect x="348" y="386.5" width="8" height="7" rx="1.5" fill="#d99a02"/>
            </g>
          </g>
          <use href="#wheel" x="270" y="390"/>
          <use href="#wheel" x="530" y="390"/>
          <g stroke="#3a3f47" stroke-width="4" fill="none">
            <line x1="270" y1="381" x2="390" y2="365"/>
            <line x1="270" y1="399" x2="390" y2="415"/>
          </g>
          <g fill="none" stroke="#e63946" stroke-width="13" stroke-linecap="round" stroke-linejoin="round">
            <path d="M390,390 L270,390 L362,282"/>
            <path d="M390,390 L362,282 L496,272"/>
            <path d="M390,390 L498,288"/>
            <path d="M495,262 L500,290 Q510,350 530,390"/>
          </g>
          <line x1="362" y1="282" x2="357" y2="262" stroke="#8d99a6" stroke-width="9" stroke-linecap="round"/>
          <path d="M326,256 Q356,246 390,258 Q384,272 356,270 Q334,270 326,256 Z" fill="#22252b"/>
          <path d="M495,262 L500,232 L526,226 Q542,230 534,250" fill="none" stroke="#22252b" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
          <!-- headlight "eye" -->
          <circle cx="512" cy="268" r="15" fill="#fff" stroke="#22252b" stroke-width="5"/>
          <circle cx="517" cy="268" r="6" fill="#22252b"/>
          <!-- chainring + near crank + level pedal -->
          <g>
            <animateTransform attributeName="transform" type="rotate" from="0 390 390" to="360 390 390" dur="1.2s" repeatCount="indefinite"/>
            <circle cx="390" cy="390" r="25" fill="none" stroke="#3a3f47" stroke-width="5" stroke-dasharray="4 3.14"/>
            <circle cx="390" cy="390" r="22" fill="#cfd6dd" stroke="#3a3f47" stroke-width="2.5"/>
            <g fill="#8a93a0">
              <circle cx="390" cy="376" r="5"/><circle cx="403.3" cy="385.7" r="5"/><circle cx="398.2" cy="401.3" r="5"/>
              <circle cx="381.8" cy="401.3" r="5"/><circle cx="376.7" cy="385.7" r="5"/>
            </g>
            <path d="M388,383 L438,386 Q443,390 438,394 L388,397 Q382,390 388,383 Z" fill="#e9edf2" stroke="#3a3f47" stroke-width="2.5" stroke-linejoin="round"/>
            <g>
              <animateTransform attributeName="transform" type="rotate" from="0 438 390" to="-360 438 390" dur="1.2s" repeatCount="indefinite"/>
              <rect x="419" y="383" width="38" height="14" rx="4" fill="#22252b"/>
              <rect x="424" y="386.5" width="8" height="7" rx="1.5" fill="#ffb703"/>
              <rect x="444" y="386.5" width="8" height="7" rx="1.5" fill="#ffb703"/>
              <circle cx="438" cy="390" r="3.5" fill="#cfd6dd"/>
            </g>
          </g>
          <circle cx="390" cy="390" r="6" fill="#3a3f47"/>
        </g>
      </g>

      <!-- body -->
      <ellipse cx="400" cy="335" rx="96" ry="52" transform="rotate(-5 400 335)" fill="#fffaf0"/>
      <path d="M316,356 Q390,400 490,340 Q450,392 380,388 Q336,380 316,356 Z" fill="#efe7d6"/>

      <!-- fishing rod with bait, held by the bike -->
      <line x1="441" y1="196" x2="716" y2="150" stroke="#8d6e4a" stroke-width="4" stroke-linecap="round"/>
      <g>
        <animateTransform attributeName="transform" type="rotate" values="-7 716 150;7 716 150;-7 716 150" dur="0.6s" repeatCount="indefinite"/>
        <line x1="716" y1="150" x2="716" y2="200" stroke="#3a3f47" stroke-width="1.5"/>
        <path d="M716,228 L706,244 L726,244 Z" fill="#3d8bd1"/>
        <ellipse cx="716" cy="215" rx="8" ry="16" fill="#5aa9e6"/>
        <circle cx="718.5" cy="206" r="1.8" fill="#1b1b1f"/>
      </g>

      <!-- head + neck -->
      <g transform="translate(84 104)">
        <g>
          <animateTransform attributeName="transform" type="rotate" values="-2.5 418 200;2.5 418 200;-2.5 418 200" dur="0.3s" repeatCount="indefinite"/>
          <path d="M408,214 C450,196 420,150 452,118" fill="none" stroke="#fffaf0" stroke-width="27" stroke-linecap="round"/>
          <path d="M438,96 L418,86 L432,102 L414,102 L436,114 Z" fill="#fffaf0"/>
          <circle cx="456" cy="110" r="23" fill="#fffaf0"/>
          <path fill="#f9c74f" d="M474,118 L588,132 Q545,178 498,166 Q474,152 474,118 Z">
            <animate attributeName="d" dur="0.3s" repeatCount="indefinite" values="M474,118 L588,132 Q545,178 498,166 Q474,152 474,118 Z;M474,118 L588,132 Q549,188 498,173 Q471,155 474,118 Z;M474,118 L588,132 Q545,178 498,166 Q474,152 474,118 Z"/>
          </path>
          <path d="M470,98 L590,125 Q597,131 588,134 L474,121 Z" fill="#f3962a"/>
          <path d="M588,134 Q597,131 590,125 L580,123 L578,133 Z" fill="#d9731a"/>
          <!-- eye, fixed on the fish -->
          <circle cx="464" cy="104" r="7.5" fill="#ffe08a"/>
          <ellipse cx="466.5" cy="103" rx="4" ry="4" fill="#1b1b1f">
            <animate attributeName="ry" dur="3.5s" repeatCount="indefinite" values="4;4;0.4;4;4" keyTimes="0;0.90;0.94;0.98;1"/>
          </ellipse>
          <circle cx="468" cy="101.5" r="1.2" fill="#fff"/>
          <!-- determined brow -->
          <line x1="456" y1="93" x2="472" y2="97" stroke="#b9ae97" stroke-width="2.5" stroke-linecap="round"/>
        </g>
      </g>

      <!-- sweat drops -->
      <g fill="#8fd3ff">
        <path d="M0,0 q-5,8 0,11 q5,-3 0,-11 Z" opacity="0">
          <animateTransform attributeName="transform" type="translate" values="520 196;480 170" dur="0.8s" repeatCount="indefinite"/>
          <animate attributeName="opacity" values="0;1;0" dur="0.8s" repeatCount="indefinite"/>
        </path>
        <path d="M0,0 q-5,8 0,11 q5,-3 0,-11 Z" opacity="0">
          <animateTransform attributeName="transform" type="translate" values="515 215;470 205" dur="0.8s" begin="-0.4s" repeatCount="indefinite"/>
          <animate attributeName="opacity" values="0;1;0" dur="0.8s" begin="-0.4s" repeatCount="indefinite"/>
        </path>
      </g>

      <!-- folded wing -->
      <g>
        <animateTransform attributeName="transform" type="rotate" values="-3 462 326;4 462 326;-3 462 326" dur="0.3s" repeatCount="indefinite"/>
        <path d="M466,324 C420,300 360,314 322,350 L346,350 L332,364 L358,360 L350,374 C402,380 452,362 466,324 Z" fill="#ece4d2" stroke="#d6ccb6" stroke-width="1.5"/>
        <path d="M322,350 L346,350 L332,364 L358,360 L350,374 L372,372 L366,352 Z" fill="#4a4e57"/>
        <path d="M440,330 Q400,322 366,342 M436,346 Q406,344 380,356" fill="none" stroke="#d6ccb6" stroke-width="2" stroke-linecap="round"/>
      </g>
    </g>
  </g>
</svg>
